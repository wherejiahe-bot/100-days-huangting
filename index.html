<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100天 · 神意照黄庭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #2B7FD8;
  --gold: #F4D758;
  --red: #E84A5F;
  --cream: #fefcf6;
  --ink: #1A1A2E;
  --ink-light: #4A4A5A;
  --ink-faint: #8A8A9A;
  --card-bg: #fff;
  --border: rgba(26,26,26,.08);
  --done: #2B7FD8;
  --done-light: rgba(43,127,216,0.08);
  --gold-light: rgba(244,215,88,0.15);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
::selection { background: var(--gold); color: var(--ink); }
body {
  font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
  background: var(--cream);
  color: var(--ink);
  line-height: 1.6;
  word-break: keep-all;
  overflow-wrap: anywhere;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.container { max-width: 720px; margin: 0 auto; padding: 0 20px; }

/* ===== Sticky Header ===== */
.app-header {
  position: sticky; top: 0; z-index: 100;
  height: 56px;
  background: var(--cream);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
}
.app-header h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--ink);
}
.header-badge {
  font-size: 0.7rem;
  padding: 3px 10px;
  border-radius: 8px;
  background: var(--done-light);
  color: var(--blue);
  font-weight: 500;
}

/* ===== Hero ===== */
.hero {
  text-align: center;
  padding: 60px 20px 40px;
  position: relative;
}
.hero::after {
  content: '';
  position: absolute;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 40px; height: 3px;
  background: var(--gold);
  border-radius: 2px;
}
.hero .num {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(72px, 15vw, 120px);
  font-weight: 900;
  line-height: 1;
  color: var(--blue);
  letter-spacing: -0.04em;
}
.hero .label {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(20px, 3.5vw, 32px);
  color: var(--ink-light);
  margin-top: 4px;
}
.hero .desc {
  font-size: 14px;
  color: var(--ink-faint);
  margin-top: 8px;
}

/* ===== Cards ===== */
.card {
  background: var(--card-bg);
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 2px 12px rgba(0,0,0,.04);
  margin-bottom: 16px;
}
.card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-faint);
  letter-spacing: 0.3px;
  text-transform: uppercase;
  margin-bottom: 12px;
}

/* ===== Today ===== */
.today-card { text-align: center; }
.today-card .date { font-size: 14px; color: var(--ink-faint); margin-bottom: 4px; }
.today-card .num { font-size: 28px; font-weight: 700; color: var(--ink); }
.today-status {
  display: inline-block;
  padding: 6px 20px;
  border-radius: 100px;
  font-size: 14px;
  font-weight: 600;
  margin-top: 8px;
}
.today-status.done { background: var(--done-light); color: var(--blue); }
.today-status.pending { background: rgba(232,74,95,0.08); color: var(--red); }

/* ===== Progress ===== */
.progress-label {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 8px;
}
.progress-label .val { font-size: 28px; font-weight: 700; color: var(--blue); }
.progress-label .total { font-size: 14px; color: var(--ink-faint); }
.progress-track {
  height: 8px;
  background: #eee;
  border-radius: 4px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--blue), #4a8fe0);
  border-radius: 4px;
  transition: width 0.6s ease;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 16px;
}
.stat {
  text-align: center;
  padding: 12px;
  background: var(--cream);
  border-radius: 8px;
}
.stat .val { font-size: 22px; font-weight: 700; color: var(--ink); }
.stat .lbl { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }

/* ===== Heatmap ===== */
.heatmap-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(28px, 1fr));
  gap: 4px;
}
.heatmap-cell {
  aspect-ratio: 1;
  border-radius: 3px;
  background: #eee;
  position: relative;
  cursor: pointer;
}
.heatmap-cell.done { background: var(--blue); opacity: 0.65; }
.heatmap-cell.today { outline: 2px solid var(--gold); outline-offset: -1px; }
.heatmap-cell:hover::after {
  content: attr(data-tip);
  position: absolute;
  bottom: calc(100% + 4px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: #fff;
  font-size: 11px;
  padding: 3px 7px;
  border-radius: 4px;
  white-space: nowrap;
  z-index: 10;
}

/* ===== Log ===== */
.log-entry {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.log-entry:last-child { border-bottom: 0; }
.log-entry .date { width: 90px; font-weight: 500; font-size: 14px; flex-shrink: 0; }
.log-entry .badge {
  font-size: 12px; padding: 2px 10px; border-radius: 100px;
  background: var(--done-light); color: var(--blue); font-weight: 600;
}
.log-entry .note { color: var(--ink-faint); font-size: 13px; }
.empty-state { text-align: center; padding: 40px 0; color: var(--ink-faint); }

/* ===== Diary ===== */
.diary-section { margin-top: 24px; }
.diary-section .card { padding: 20px 24px; }
.diary-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.diary-header h3 { font-size: 15px; font-weight: 600; }
.diary-date { font-size: 12px; color: var(--blue); font-weight: 500; margin-bottom: 8px; }
.diary-body { font-size: 14px; line-height: 1.8; color: var(--ink); white-space: pre-wrap; }
.diary-source {
  margin-top: 14px;
  padding: 12px 16px;
  background: var(--gold-light);
  border-left: 3px solid var(--gold);
  border-radius: 0 6px 6px 0;
  font-size: 13px;
  color: #5a4a30;
}
.diary-empty { color: var(--ink-faint); font-size: 14px; padding: 16px 0; text-align: center; }

/* Diary date selector */
.diary-selector {
  display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;
}
.diary-selector button {
  padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border);
  background: transparent; cursor: pointer; font-size: 12px; color: var(--ink-light);
  transition: all .15s; font-family: inherit;
}
.diary-selector button:hover { border-color: var(--blue); color: var(--blue); }
.diary-selector button.active { background: var(--blue); color: #fff; border-color: var(--blue); }

/* Log entry clickable */
.log-entry { cursor: pointer; }
.log-entry:hover { background: var(--done-light); margin: 0 -4px; padding: 10px 4px; border-radius: 6px; }

/* ===== Responsive ===== */
@media (max-width: 600px) {
  .hero { padding: 40px 16px 32px; }
  .card { padding: 18px; }
  .stats-grid { gap: 8px; }
  .stat .val { font-size: 18px; }
  .log-entry .date { width: 75px; font-size: 13px; }
}
</style>
</head>
<body>

<header class="app-header">
  <h1>神意照黄庭</h1>
  <span class="header-badge">100-day</span>
</header>

<div class="container">

  <section class="hero">
    <div class="num">100</div>
    <div class="label">天</div>
    <div class="desc">每日15分钟，神意内照</div>
  </section>

  <div class="card today-card">
    <div class="date" id="todayDate">—</div>
    <div class="num" id="todayDayNum">Day 1</div>
    <div class="today-status" id="todayStatus">加载中...</div>
  </div>

  <div class="card">
    <div class="progress-label">
      <span class="val" id="doneCount">0</span>
      <span class="total">/ 100 天</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="stats-grid">
      <div class="stat"><div class="val" id="statDone">0</div><div class="lbl">已完成</div></div>
      <div class="stat"><div class="val" id="statStreak">0</div><div class="lbl">连续</div></div>
      <div class="stat"><div class="val" id="statRemain">100</div><div class="lbl">剩余</div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">进度一览</div>
    <div class="heatmap-grid" id="heatmapGrid"></div>
  </div>

  <div class="card">
    <div class="card-title">每日记录</div>
    <div id="logList">
      <div class="empty-state">尚未开始</div>
    </div>
  </div>

  <div class="diary-section">
    <div class="card" id="diaryCard">
      <div class="diary-header">
        <span style="font-size:18px;">📖</span>
        <h3>每日日记</h3>
      </div>
      <div class="diary-selector" id="diarySelector"></div>
      <div id="diaryContent">
        <div class="diary-empty">完成练习后，日记会自动记录在这里。</div>
      </div>
    </div>
  </div>

</div>

<script>
const dataUrl = 'log.json';

async function loadData() {
  try {
    const resp = await fetch(dataUrl);
    if (!resp.ok) throw new Error('no data');
    return await resp.json();
  } catch {
    return { days: [], streak: 0 };
  }
}

function formatDate(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function todayStr() { return formatDate(new Date()); }

function isToday(s) { return s === todayStr(); }

function calcStreak(days) {
  if (!days.length) return 0;
  const sorted = days.slice().sort().reverse();
  let streak = 0;
  const today = todayStr();
  const start = new Date();
  for (let i = 0; i < sorted.length; i++) {
    const expected = formatDate(new Date(start.getTime() - (streak) * 86400000));
    if (sorted[i] === expected) { streak++; }
    else break;
  }
  return streak;
}

function generateHeatmapHTML(days) {
  const daySet = new Set(days);
  const today = todayStr();
  const daysEl = [];
  const start = new Date();
  start.setDate(start.getDate() - 99);
  for (let i = 0; i < 100; i++) {
    const d = new Date(start.getTime() + i * 86400000);
    const s = formatDate(d);
    const cls = daySet.has(s) ? 'heatmap-cell done' : 'heatmap-cell';
    const todayCls = isToday(s) ? ' today' : '';
    daysEl.push(`<div class="${cls}${todayCls}" data-tip="${s}"></div>`);
  }
  return daysEl.join('');
}

async function render() {
  const data = await loadData();
  const days = data.days || [];
  const today = todayStr();
  const doneToday = days.includes(today);
  const doneCount = days.length;
  const streak = calcStreak(days);
  const remain = Math.max(0, 100 - doneCount);

  document.getElementById('todayDate').textContent = today;
  document.getElementById('todayDayNum').textContent = 'Day ' + (doneCount || 1);
  const statusEl = document.getElementById('todayStatus');
  statusEl.textContent = doneToday ? '✅ 已完成' : '⏳ 未完成';
  statusEl.className = 'today-status ' + (doneToday ? 'done' : 'pending');

  document.getElementById('doneCount').textContent = doneCount;
  document.getElementById('progressFill').style.width = (doneCount / 100 * 100) + '%';
  document.getElementById('statDone').textContent = doneCount;
  document.getElementById('statStreak').textContent = streak;
  document.getElementById('statRemain').textContent = remain;

  document.getElementById('heatmapGrid').innerHTML = generateHeatmapHTML(days);

  const logDiv = document.getElementById('logList');
  if (days.length === 0) {
    logDiv.innerHTML = '<div class="empty-state">尚未开始</div>';
  } else {
    const sorted = days.slice().sort().reverse();
    logDiv.innerHTML = sorted.map(s => {
      const badge = '<span class="badge">✅ 完成</span>';
      return `<div class="log-entry"><span class="date">${s}</span>${badge} <span class="note">神意照黄庭 15min</span></div>`;
    }).join('');
  }

  // Build diary selector from all dates with notes
  const notes = data.notes || {};
  const noteDates = Object.keys(notes).sort().reverse();

  const diaryEl = document.getElementById('diaryContent');
  const selEl = document.getElementById('diarySelector');
  let activeDiaryDate = noteDates.length > 0 ? noteDates[0] : null;

  function viewDiary(date) {
    activeDiaryDate = date;
    // Update selector buttons
    selEl.querySelectorAll('button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.date === date);
    });
    // Render diary
    const note = notes[date];
    if (note) {
      const dayIndex = days.indexOf(date) + 1;
      const lines = note.split('\n');
      const bodyLines = [];
      let sourceHtml = '';
      for (const line of lines) {
        if (line.startsWith('✨')) {
          sourceHtml = `<div class="diary-source">${line.replace('✨', '').trim()}</div>`;
        } else if (line.trim()) {
          bodyLines.push(line);
        }
      }
      diaryEl.innerHTML = `
        <div class="diary-date">${date} · Day ${dayIndex}</div>
        <div class="diary-body">${bodyLines.join('\n')}</div>
        ${sourceHtml}
      `;
    } else {
      diaryEl.innerHTML = '<div class="diary-empty">该日暂无日记记录。</div>';
    }
  }

  // Render selector buttons
  if (noteDates.length > 0) {
    selEl.innerHTML = noteDates.map(d =>
      `<button class="${d === activeDiaryDate ? 'active' : ''}" data-date="${d}">${d}</button>`
    ).join('');
    selEl.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => viewDiary(btn.dataset.date));
    });
    viewDiary(activeDiaryDate);
  } else {
    selEl.innerHTML = '';
    diaryEl.innerHTML = '<div class="diary-empty">完成练习后，日记会自动记录在这里。</div>';
  }

  // Make log entries clickable — view diary for that date
  document.querySelectorAll('.log-entry').forEach(el => {
    const dateEl = el.querySelector('.date');
    if (dateEl && notes[dateEl.textContent.trim()]) {
      el.style.cursor = 'pointer';
      el.title = '点击查看日记';
      el.addEventListener('click', () => viewDiary(dateEl.textContent.trim()));
    }
  });
}

render();
</script>
</body>
</html>
