<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100天 · 神意照黄庭</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f5f5f5;
    --surface: rgba(255,255,255,0.72);
    --border: rgba(0,0,0,0.06);
    --text: #1a1a1a;
    --text-dim: #8a8a8a;
    --accent: #c4a46c;
    --accent-light: #e8dcc8;
    --done: #7bc4a0;
    --miss: #e8b4b4;
    --radius: 12px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    word-break: keep-all;
    overflow-wrap: anywhere;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 720px; margin: 0 auto; padding: 48px 24px; }

  /* 玻璃卡片 */
  .glass {
    background: var(--surface);
    backdrop-filter: blur(32px);
    -webkit-backdrop-filter: blur(32px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }

  /* 层级 */
  .display { font-size: clamp(48px, 8vw, 96px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .headline { font-size: clamp(32px, 5vw, 56px); font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
  .subtitle { font-size: clamp(20px, 2.5vw, 28px); font-weight: 600; line-height: 1.3; }
  .body { font-size: clamp(16px, 1.5vw, 20px); font-weight: 400; line-height: 1.6; }
  .caption { font-size: clamp(13px, 1.2vw, 15px); font-weight: 400; color: var(--text-dim); }

  /* 头部 */
  header { text-align: center; margin-bottom: 48px; }
  header .display { margin-bottom: 8px; }
  header .caption { margin-top: 4px; }

  /* 今日状态 */
  .today-card { margin-bottom: 32px; text-align: center; }
  .today-card .headline { margin-bottom: 4px; }
  .today-status { display: inline-block; padding: 8px 24px; border-radius: 100px; font-weight: 510; font-size: 16px; }
  .today-status.done { background: var(--done); color: #fff; }
  .today-status.pending { background: var(--miss); color: #fff; }

  /* 进度条 */
  .progress-section { margin-bottom: 32px; }
  .progress-label { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .progress-track { height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.6s ease; }
  .progress-stats { display: flex; gap: 24px; margin-top: 12px; flex-wrap: wrap; }
  .progress-stats .stat { flex: 1; min-width: 80px; text-align: center; }
  .progress-stats .stat .val { font-size: 28px; font-weight: 700; }
  .progress-stats .stat .lbl { font-size: 13px; color: var(--text-dim); }

  /* 热力图 */
  .heatmap-section { margin-bottom: 32px; }
  .heatmap-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(32px, 1fr));
    gap: 6px;
    margin-top: 12px;
  }
  .heatmap-cell {
    aspect-ratio: 1;
    border-radius: 4px;
    background: #e8e8e8;
    position: relative;
    cursor: pointer;
  }
  .heatmap-cell.done { background: var(--accent); }
  .heatmap-cell.today { outline: 2px solid var(--accent); outline-offset: -2px; }
  .heatmap-cell:hover::after {
    content: attr(data-tip);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    z-index: 10;
  }

  /* 记录表 */
  .log-section .glass { padding: 16px 24px; }
  .log-entry { display: flex; align-items: center; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .log-entry:last-child { border-bottom: 0; }
  .log-entry .date { width: 100px; font-weight: 510; flex-shrink: 0; }
  .log-entry .badge { font-size: 14px; padding: 2px 10px; border-radius: 100px; }
  .log-entry .badge.done { background: var(--done); color: #fff; }
  .log-entry .badge.miss { background: var(--miss); color: #fff; }
  .log-entry .note { color: var(--text-dim); font-size: 14px; }

  .empty-state { text-align: center; padding: 48px 0; color: var(--text-dim); }
  .empty-state .subtitle { margin-bottom: 8px; color: var(--text-dim); }

  /* 日记卡片 */
  .diary-section { margin-top: 32px; }
  .diary-section .glass { padding: 20px 24px; }
  .diary-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .diary-date { font-weight: 510; color: var(--accent); }
  .diary-body { font-size: 15px; line-height: 1.8; color: var(--text); white-space: pre-wrap; }
  .diary-source { margin-top: 16px; padding: 12px 16px; background: var(--accent-light); border-radius: 8px; font-size: 14px; color: #5a4a30; }
  .diary-empty { color: var(--text-dim); font-size: 14px; padding: 16px 0; text-align: center; }
</style>
</head>
<body>
<div class="container" id="app">

  <header>
    <div class="display">100</div>
    <div class="subtitle" style="color:var(--text-dim);">天 · 神意照黄庭</div>
    <div class="caption">每日15分钟，神意内照，回收精气。</div>
  </header>

  <!-- 今日状态 -->
  <div class="today-card glass" id="todayCard">
    <div class="caption" style="margin-bottom:4px;">今日</div>
    <div class="headline" id="todayDate">—</div>
    <div class="today-status" id="todayStatus">加载中...</div>
  </div>

  <!-- 进度 -->
  <div class="progress-section glass">
    <div class="progress-label">
      <span class="body" id="doneCount">0</span>
      <span class="caption">/ 100 天</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-stats">
      <div class="stat"><div class="val" id="statDone">0</div><div class="lbl">已完成</div></div>
      <div class="stat"><div class="val" id="statStreak">0</div><div class="lbl">连续天数</div></div>
      <div class="stat"><div class="val" id="statRemain">100</div><div class="lbl">剩余</div></div>
    </div>
  </div>

  <!-- 热力图 -->
  <div class="heatmap-section glass">
    <div class="body" style="margin-bottom:4px;">进度一览</div>
    <div class="caption" style="margin-bottom:8px;">每日一格</div>
    <div class="heatmap-grid" id="heatmapGrid"></div>
  </div>

  <!-- 记录 -->
  <div class="log-section">
    <div class="body" style="margin-bottom:12px;">每日记录</div>
    <div class="glass" id="logList">
      <div class="empty-state">
        <div class="subtitle">尚未开始</div>
        <div class="body">今天就开始你的第一个15分钟吧。</div>
      </div>
    </div>
  </div>

  <!-- 今日日记 -->
  <div class="diary-section">
    <div class="glass" id="diaryCard">
      <div class="diary-header">
        <span>📖</span>
        <span class="body">今日日记</span>
      </div>
      <div id="diaryContent">
        <div class="diary-empty">完成练习后，日记会自动记录在这里。</div>
      </div>
    </div>
  </div>

</div>

<script>
const dataUrl = 'log.json';

async function loadData() {
  try {
    const resp = await fetch(dataUrl);
    if (!resp.ok) throw new Error('no data');
    return await resp.json();
  } catch {
    return { days: [], streak: 0 };
  }
}

function formatDate(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function todayStr() { return formatDate(new Date()); }

function isToday(s) { return s === todayStr(); }

function calcStreak(days) {
  if (!days.length) return 0;
  const sorted = days.slice().sort().reverse();
  let streak = 0;
  const today = todayStr();
  // 从今天或昨天开始算连续
  const start = new Date();
  for (let i = 0; i < sorted.length; i++) {
    const expected = formatDate(new Date(start.getTime() - (streak) * 86400000));
    if (sorted[i] === expected) { streak++; }
    else break;
  }
  return streak;
}

function generateHeatmapHTML(days) {
  const daySet = new Set(days);
  const today = todayStr();
  const daysEl = [];
  // 从100天前到今天
  const start = new Date();
  start.setDate(start.getDate() - 99);
  for (let i = 0; i < 100; i++) {
    const d = new Date(start.getTime() + i * 86400000);
    const s = formatDate(d);
    const cls = daySet.has(s) ? 'heatmap-cell done' : 'heatmap-cell';
    const todayCls = isToday(s) ? ' today' : '';
    daysEl.push(`<div class="${cls}${todayCls}" data-tip="${s}"></div>`);
  }
  return daysEl.join('');
}

async function render() {
  const data = await loadData();
  const days = data.days || [];
  const today = todayStr();
  const doneToday = days.includes(today);
  const doneCount = days.length;
  const streak = calcStreak(days);
  const remain = Math.max(0, 100 - doneCount);

  // 今日
  document.getElementById('todayDate').textContent = today;
  const statusEl = document.getElementById('todayStatus');
  statusEl.textContent = doneToday ? '✅ 已完成' : '⏳ 未完成';
  statusEl.className = 'today-status ' + (doneToday ? 'done' : 'pending');

  // 进度
  document.getElementById('doneCount').textContent = doneCount;
  document.getElementById('progressFill').style.width = (doneCount / 100 * 100) + '%';
  document.getElementById('statDone').textContent = doneCount;
  document.getElementById('statStreak').textContent = streak;
  document.getElementById('statRemain').textContent = remain;

  // 热力图
  document.getElementById('heatmapGrid').innerHTML = generateHeatmapHTML(days);

  // 记录列表
  const logDiv = document.getElementById('logList');
  if (days.length === 0) {
    logDiv.innerHTML = '<div class="empty-state"><div class="subtitle">尚未开始</div><div class="body">今天就开始你的第一个15分钟吧。</div></div>';
  } else {
    const sorted = days.slice().sort().reverse();
    logDiv.innerHTML = sorted.map(s => {
      const badge = doneToday && isToday(s) ? '<span class="badge done">✅ 完成</span>' : '<span class="badge done">✅</span>';
      return `<div class="log-entry"><span class="date body">${s}</span>${badge} <span class="note">神意照黄庭 15min</span></div>`;
    }).join('');
  }

  // 今日日记
  const diaryEl = document.getElementById('diaryContent');
  const notes = data.notes || {};
  const todayNote = notes[today];
  if (doneToday && todayNote) {
    const lines = todayNote.split('\n');
    const bodyLines = [];
    let sourceHtml = '';
    for (const line of lines) {
      if (line.startsWith('✨')) {
        sourceHtml = `<div class="diary-source">${line.replace('✨', '').trim()}</div>`;
      } else if (line.trim()) {
        bodyLines.push(line);
      }
    }
    diaryEl.innerHTML = `
      <div class="diary-date caption">${today} · Day ${days.length}</div>
      <div class="diary-body">${bodyLines.join('\n')}</div>
      ${sourceHtml}
    `;
  } else {
    diaryEl.innerHTML = '<div class="diary-empty">完成练习后，日记会自动记录在这里。</div>';
  }
}

render();
</script>
</body>
</html>
