<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100天 · 神意照黄庭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
/* ===== Reset & Base ===== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root {
  --white: #ffffff;
  --bg: #f8f8f8;
  --bg-card: rgba(255,255,255,0.85);
  --bg-card-hover: rgba(255,255,255,0.95);
  --ink: #1a1a1a;
  --ink-secondary: #6e6e7a;
  --ink-tertiary: #9a9aa8;
  --ink-quaternary: #c4c4d0;
  --border: rgba(0,0,0,0.05);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04),0 1px 2px rgba(0,0,0,0.02);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.04),0 2px 8px rgba(0,0,0,0.02);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.05),0 4px 16px rgba(0,0,0,0.02);
  --accent: #c4a35a;
  --accent-light: rgba(196,163,90,0.10);
  --accent-mid: rgba(196,163,90,0.25);
  --done: #7fa86a;
  --done-light: rgba(127,168,106,0.10);
  --pending: #c47a7a;
  --pending-light: rgba(196,122,122,0.10);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --font-serif: 'Noto Serif SC', 'Source Han Serif SC', serif;
  --font-sans: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
}

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.7;
  word-break: keep-all;
  overflow-wrap: anywhere;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ===== Subtle Background Texture ===== */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% -10%, rgba(196,163,90,0.04) 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 80% 90%, rgba(127,168,106,0.03) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px;
  position: relative;
  z-index: 1;
}

/* ===== Header ===== */
.app-header {
  position: sticky;
  top: 20px;
  z-index: 100;
  max-width: 680px;
  margin: 0 auto 24px;
  padding: 12px 24px;
  background: var(--bg-card);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.app-header h1 {
  font-family: var(--font-serif);
  font-size: clamp(16px, 2.2vw, 20px);
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 0.02em;
}

.header-badge {
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 100px;
  background: var(--accent-light);
  color: var(--accent);
  font-weight: 600;
  letter-spacing: 0.3px;
}

/* ===== Hero ===== */
.hero {
  text-align: center;
  padding: 48px 20px 40px;
  position: relative;
}

.hero .num {
  font-family: var(--font-serif);
  font-size: clamp(72px, 16vw, 110px);
  font-weight: 900;
  line-height: 1;
  background: linear-gradient(180deg, var(--ink) 30%, var(--ink-secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.04em;
}

.hero .label {
  font-family: var(--font-serif);
  font-size: clamp(20px, 3.5vw, 28px);
  font-weight: 700;
  color: var(--ink-secondary);
  margin-top: 2px;
}

.hero .desc {
  font-size: clamp(13px, 2vw, 15px);
  color: var(--ink-tertiary);
  margin-top: 8px;
  font-weight: 400;
  letter-spacing: 0.5px;
}

/* Decorative line */
.hero::after {
  content: '';
  display: block;
  width: 48px;
  height: 2px;
  background: var(--accent);
  margin: 28px auto 0;
  border-radius: 2px;
  opacity: 0.6;
}

/* ===== Card ===== */
.card {
  background: var(--bg-card);
  backdrop-filter: blur(16px) saturate(1.3);
  -webkit-backdrop-filter: blur(16px) saturate(1.3);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.25s ease, background 0.25s ease;
}

.card:hover {
  box-shadow: var(--shadow-md);
  background: var(--bg-card-hover);
}

.card-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-tertiary);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  margin-bottom: 16px;
}

.card-accent {
  border-top: 2px solid var(--accent-mid);
}

/* ===== Today Card ===== */
.today-card {
  text-align: center;
  padding: 28px 24px;
}

.today-card .date {
  font-size: 13px;
  color: var(--ink-tertiary);
  margin-bottom: 6px;
  font-weight: 500;
}

.today-card .day-num {
  font-size: clamp(24px, 4vw, 32px);
  font-weight: 700;
  color: var(--ink);
  line-height: 1.3;
}

.today-status {
  display: inline-block;
  padding: 6px 20px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 600;
  margin-top: 10px;
  letter-spacing: 0.2px;
}

.today-status.done {
  background: var(--done-light);
  color: var(--done);
}

.today-status.pending {
  background: var(--pending-light);
  color: var(--pending);
}

/* ===== Progress ===== */
.progress-label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
}

.progress-label .val {
  font-size: clamp(24px, 4vw, 32px);
  font-weight: 700;
  color: var(--ink);
}

.progress-label .total {
  font-size: 14px;
  color: var(--ink-tertiary);
}

.progress-track {
  height: 6px;
  background: #eeeeee;
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 4px;
  background: linear-gradient(90deg, #c4a35a, #d4b87a);
  transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ===== Stats Grid ===== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 18px;
}

.stat {
  text-align: center;
  padding: 14px 8px;
  background: rgba(0,0,0,0.02);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}

.stat .val {
  font-size: clamp(20px, 3.5vw, 26px);
  font-weight: 700;
  color: var(--ink);
  line-height: 1.2;
}

.stat .lbl {
  font-size: 12px;
  color: var(--ink-tertiary);
  margin-top: 3px;
  font-weight: 500;
}

/* ===== Heatmap ===== */
.heatmap-grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 4px;
}

.heatmap-cell {
  aspect-ratio: 1;
  border-radius: 3px;
  background: #f0f0f0;
  position: relative;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.2s ease;
}

.heatmap-cell:hover {
  transform: scale(1.2);
  z-index: 2;
}

.heatmap-cell.done {
  background: var(--accent-mid);
}

.heatmap-cell.done:hover {
  background: var(--accent);
}

.heatmap-cell.today {
  outline: 2px solid var(--done);
  outline-offset: -1px;
}

.heatmap-cell:hover::after {
  content: attr(data-tip);
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: #fff;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 4px;
  white-space: nowrap;
  z-index: 10;
  pointer-events: none;
}

/* ===== Log ===== */
.log-list .log-entry {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
  cursor: pointer;
}

.log-list .log-entry:last-child {
  border-bottom: 0;
}

.log-list .log-entry:hover {
  background: rgba(196,163,90,0.04);
  margin: 0 -8px;
  padding: 10px 8px;
  border-radius: 6px;
}

.log-entry .date {
  width: 90px;
  font-weight: 500;
  font-size: 14px;
  color: var(--ink);
  flex-shrink: 0;
}

.log-entry .badge {
  font-size: 11px;
  padding: 2px 10px;
  border-radius: 100px;
  background: var(--done-light);
  color: var(--done);
  font-weight: 600;
  flex-shrink: 0;
}

.log-entry .note {
  color: var(--ink-tertiary);
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.empty-state {
  text-align: center;
  padding: 36px 0;
  color: var(--ink-tertiary);
  font-size: 14px;
}

/* ===== Diary Section ===== */
.diary-section {
  margin-top: 8px;
}

.diary-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.diary-header .icon {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--accent-light);
  border-radius: 6px;
  font-size: 14px;
}

.diary-header h3 {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
}

.diary-selector {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.diary-selector button {
  padding: 4px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  cursor: pointer;
  font-size: 12px;
  color: var(--ink-secondary);
  transition: all 0.15s;
  font-family: inherit;
}

.diary-selector button:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.diary-selector button.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.diary-date {
  font-size: 12px;
  color: var(--ink-tertiary);
  font-weight: 500;
  margin-bottom: 10px;
  letter-spacing: 0.3px;
}

.diary-date .day-tag {
  display: inline-block;
  background: var(--accent-light);
  color: var(--accent);
  padding: 1px 8px;
  border-radius: 4px;
  font-weight: 600;
  margin-left: 6px;
}

.diary-body {
  font-size: 14px;
  line-height: 1.9;
  color: var(--ink);
  white-space: pre-wrap;
}

.diary-source {
  margin-top: 16px;
  padding: 14px 18px;
  background: var(--accent-light);
  border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0;
  font-size: 13px;
  color: #5a4a30;
  line-height: 1.7;
}

.diary-empty {
  color: var(--ink-tertiary);
  font-size: 14px;
  padding: 24px 0;
  text-align: center;
}

/* ===== Responsive ===== */
@media (max-width: 600px) {
  .app-header {
    top: 12px;
    margin: 0 12px 20px;
    padding: 10px 16px;
    border-radius: var(--radius);
  }
  .hero {
    padding: 32px 12px 28px;
  }
  .card {
    padding: 18px;
    border-radius: var(--radius);
  }
  .today-card {
    padding: 22px 18px;
  }
  .stats-grid {
    gap: 8px;
  }
  .stat {
    padding: 10px 6px;
  }
  .log-entry .date {
    width: 75px;
    font-size: 13px;
  }
  .heatmap-grid {
    grid-template-columns: repeat(10, 1fr);
    gap: 3px;
  }
}

@media (max-width: 400px) {
  .heatmap-grid {
    grid-template-columns: repeat(8, 1fr);
  }
}
</style>
</head>
<body>

<header class="app-header">
  <h1>神意照黄庭</h1>
  <span class="header-badge">100-day</span>
</header>

<div class="container">

  <!-- Hero -->
  <section class="hero">
    <div class="num">100</div>
    <div class="label">天</div>
    <div class="desc">每日 15 分钟，神意内照</div>
  </section>

  <!-- Today -->
  <div class="card today-card">
    <div class="date" id="todayDate">—</div>
    <div class="day-num" id="todayDayNum">Day 1</div>
    <div class="today-status" id="todayStatus">加载中...</div>
  </div>

  <!-- Progress -->
  <div class="card card-accent">
    <div class="progress-label">
      <span class="val" id="doneCount">0</span>
      <span class="total">/ 100 天</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="stats-grid">
      <div class="stat"><div class="val" id="statDone">0</div><div class="lbl">已完成</div></div>
      <div class="stat"><div class="val" id="statStreak">0</div><div class="lbl">连续</div></div>
      <div class="stat"><div class="val" id="statRemain">100</div><div class="lbl">剩余</div></div>
    </div>
  </div>

  <!-- Heatmap -->
  <div class="card">
    <div class="card-title">进度一览</div>
    <div class="heatmap-grid" id="heatmapGrid"></div>
  </div>

  <!-- Log -->
  <div class="card">
    <div class="card-title">每日记录</div>
    <div class="log-list" id="logList">
      <div class="empty-state">尚未开始</div>
    </div>
  </div>

  <!-- Diary -->
  <div class="diary-section">
    <div class="card" id="diaryCard">
      <div class="diary-header">
        <div class="icon">&#9998;</div>
        <h3>每日日记</h3>
      </div>
      <div class="diary-selector" id="diarySelector"></div>
      <div id="diaryContent">
        <div class="diary-empty">完成练习后，日记会自动记录在这里。</div>
      </div>
    </div>
  </div>

</div>

<script>
const dataUrl = 'log.json';

async function loadData() {
  try {
    const resp = await fetch(dataUrl + '?t=' + Date.now());
    if (!resp.ok) throw new Error('no data');
    return await resp.json();
  } catch {
    return { days: [], streak: 0 };
  }
}

function formatDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function todayStr() { return formatDate(new Date()); }

function isToday(s) { return s === todayStr(); }

function calcStreak(days) {
  if (!days.length) return 0;
  const sorted = days.slice().sort().reverse();
  let streak = 0;
  const start = new Date();
  for (let i = 0; i < sorted.length; i++) {
    const d = new Date(start.getTime() - streak * 86400000);
    const expected = formatDate(d);
    if (sorted[i] === expected) { streak++; }
    else break;
  }
  return streak;
}

function generateHeatmapHTML(days) {
  const daySet = new Set(days);
  const today = todayStr();
  const cells = [];
  const start = new Date();
  start.setDate(start.getDate() - 99);
  for (let i = 0; i < 100; i++) {
    const d = new Date(start.getTime() + i * 86400000);
    const s = formatDate(d);
    const cls = daySet.has(s) ? 'heatmap-cell done' : 'heatmap-cell';
    const todayCls = isToday(s) ? ' today' : '';
    cells.push('<div class="' + cls + todayCls + '" data-tip="' + s + '"></div>');
  }
  return cells.join('');
}

function escHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

async function render() {
  const data = await loadData();
  const days = data.days || [];
  const today = todayStr();
  const doneToday = days.includes(today);
  const doneCount = days.length;
  const streak = calcStreak(days);
  const remain = Math.max(0, 100 - doneCount);

  // Today
  document.getElementById('todayDate').textContent = today;
  document.getElementById('todayDayNum').textContent = 'Day ' + (doneCount || 1);
  const statusEl = document.getElementById('todayStatus');
  statusEl.textContent = doneToday ? '已完成' : '未完成';
  statusEl.className = 'today-status ' + (doneToday ? 'done' : 'pending');

  // Progress
  document.getElementById('doneCount').textContent = doneCount;
  document.getElementById('progressFill').style.width = (doneCount / 100 * 100) + '%';
  document.getElementById('statDone').textContent = doneCount;
  document.getElementById('statStreak').textContent = streak;
  document.getElementById('statRemain').textContent = remain;

  // Heatmap
  document.getElementById('heatmapGrid').innerHTML = generateHeatmapHTML(days);

  // Log
  const logDiv = document.getElementById('logList');
  if (days.length === 0) {
    logDiv.innerHTML = '<div class="empty-state">尚未开始</div>';
  } else {
    const sorted = days.slice().sort().reverse();
    logDiv.innerHTML = sorted.map(function(s) {
      return '<div class="log-entry" data-date="' + s + '">' +
        '<span class="date">' + s + '</span>' +
        '<span class="badge">完成</span>' +
        ' <span class="note">神意照黄庭 15min</span></div>';
    }).join('');
  }

  // Diary
  const notes = data.notes || {};
  const noteDates = Object.keys(notes).sort().reverse();

  const diaryEl = document.getElementById('diaryContent');
  const selEl = document.getElementById('diarySelector');
  var activeDiaryDate = noteDates.length > 0 ? noteDates[0] : null;

  function viewDiary(date) {
    activeDiaryDate = date;
    var btns = selEl.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('active', btns[i].dataset.date === date);
    }
    var note = notes[date];
    if (note) {
      var dayIndex = days.indexOf(date) + 1;
      var lines = note.split('\n');
      var bodyLines = [];
      var sourceHtml = '';
      for (var j = 0; j < lines.length; j++) {
        var line = lines[j];
        if (line.charAt(0) === '\u2728') {
          sourceHtml = '<div class="diary-source">' + escHtml(line.replace('\u2728', '').trim()) + '</div>';
        } else if (line.trim()) {
          bodyLines.push(line);
        }
      }
      diaryEl.innerHTML =
        '<div class="diary-date">' + date + ' <span class="day-tag">Day ' + dayIndex + '</span></div>' +
        '<div class="diary-body">' + escHtml(bodyLines.join('\n')) + '</div>' +
        sourceHtml;
    } else {
      diaryEl.innerHTML = '<div class="diary-empty">该日暂无日记记录。</div>';
    }
  }

  // Render diary selector
  if (noteDates.length > 0) {
    var html = '';
    for (var k = 0; k < noteDates.length; k++) {
      var d = noteDates[k];
      html += '<button class="' + (d === activeDiaryDate ? 'active' : '') + '" data-date="' + d + '">' + d + '</button>';
    }
    selEl.innerHTML = html;
    var btns2 = selEl.querySelectorAll('button');
    for (var m = 0; m < btns2.length; m++) {
      btns2[m].addEventListener('click', function() { viewDiary(this.dataset.date); });
    }
    viewDiary(activeDiaryDate);
  } else {
    selEl.innerHTML = '';
    diaryEl.innerHTML = '<div class="diary-empty">完成练习后，日记会自动记录在这里。</div>';
  }

  // Clickable log entries → view diary
  var logEntries = document.querySelectorAll('.log-entry');
  for (var n = 0; n < logEntries.length; n++) {
    (function(el) {
      var dateText = el.querySelector('.date');
      if (dateText && notes[dateText.textContent.trim()]) {
        el.title = '点击查看日记';
        el.addEventListener('click', function() { viewDiary(dateText.textContent.trim()); });
      }
    })(logEntries[n]);
  }
}

render();
</script>
</body>
</html>
